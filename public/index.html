  <body>
    <script>
      // github.io → korea.ac.kr 정규 도메인으로 리다이렉트
      if (window.location.hostname === 'finseclab.github.io') {
        window.location.replace(
          'https://finseclab.korea.ac.kr' +
          window.location.pathname +
          window.location.search +
          window.location.hash
        );
      }
    </script>
    <script>
      // GitHub Pages SPA redirect restore
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <script>
      // 실제 루트('/') 직접 방문 시에만 브라우저 언어로 분기.
      // (위 SPA 복원이 먼저 실행돼 깊은 경로는 이미 pathname이 바뀐 상태이므로 여기서 걸리지 않음)
      (function() {
        var l = window.location;
        if (l.pathname === '/' && l.search.charAt(1) !== '/') {
          var nav = (navigator.language || '').toLowerCase();
          var lang = nav.indexOf('ko') === 0 ? 'ko' : 'en';
          l.replace('/' + lang + '/' + l.hash);
        }
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
